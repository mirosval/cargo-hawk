[package]
name = "cargo-hawk"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
ratatui = "0.29.0"
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
tokio = { version = "1.41", features = ["full"] }
notify = "8.2"
ansi-to-tui = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
edit = "0.1.5"
tokio-util = "0.7.17"
futures = "0.3.31"
color-eyre = "0.6.5"
signal-hook = "0.3.18"
bon = "3.8.1"

[dev-dependencies]
insta = { version = "1.43.2", features = ["yaml"] }
insta-cmd = "0.6.0"
testresult = "0.4.1"
