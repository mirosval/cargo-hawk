[package]
name = "cargo-hawk"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
ratatui = "0.29.0"
crossterm = "0.28"
tokio = { version = "1.41", features = ["full"] }
anyhow = "1.0"
notify = "6.1"
strip-ansi-escapes = "0.2"
